[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ass2ass"
version = "0.1.0"
description = "Agentic Signaling System to Any Shared Surface: agent communication over any shared medium."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5"]
cbor = ["cbor2>=5.6.5,<6"]
protection = ["jwcrypto>=1.5.6,<2"]
experimental = ["cbor2>=5.6.5,<6", "jwcrypto>=1.5.6,<2"]

[project.scripts]
ass2ass = "ass2ass.__main__:main"
ass2ass-pipe = "ass2ass.pipe_cli:main"
ass2ass-wire = "ass2ass.wire_cli:main"
ass2ass-ssh = "ass2ass.ssh_cli:main"

[tool.setuptools.packages.find]
where = ["skills/ass2ass/scripts"]
include = ["ass2ass*"]
