[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ass2ass"
version = "0.1.0"
description = "Agentic Signaling System to Any Shared Surface: agent communication over any shared medium."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ass2ass = "ass2ass.__main__:main"

[tool.setuptools.packages.find]
where = ["skills/ass2ass/scripts"]
include = ["ass2ass*"]
